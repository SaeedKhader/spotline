# Generate Spotline.xcodeproj with `xcodegen generate`. The .xcodeproj is not committed.
name: Spotline
options:
  bundleIdPrefix: io.github.saeedkhader
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  SpotlineKit:
    path: Packages/SpotlineKit
targets:
  Spotline:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: SpotlineKit
        product: EditorUI
      - package: SpotlineKit
        product: EditorCommands
      # The MCP helper agents launch, next to the app's executable (docs/AGENTS.md).
      - target: spotline-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.saeedkhader.spotline
        PRODUCT_NAME: Spotline
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spotline
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Saeed Khader. GPL-3.0-or-later."
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  spotline-mcp:
    type: tool
    platform: macOS
    sources: [Packages/SpotlineKit/Sources/SpotlineMCP]
    dependencies:
      - package: SpotlineKit
        product: AgentBridge
    settings:
      base:
        PRODUCT_NAME: spotline-mcp
        PRODUCT_BUNDLE_IDENTIFIER: io.github.saeedkhader.spotline.mcp
        SKIP_INSTALL: YES
  SpotlineUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - AppUITests
      - path: Fixtures/testsrc-23.976.mp4
        buildPhase: resources
      - path: Fixtures/testsrc-23.976.srt
        buildPhase: resources
      - path: Fixtures/cuts-25.mp4
        buildPhase: resources
      - path: Fixtures/cuts-25.srt
        buildPhase: resources
      - path: Fixtures/two-tracks.mkv
        buildPhase: resources
      - path: Fixtures/styled-23.976.ass
        buildPhase: resources
      - path: Fixtures/translation-source-23.976.srt
        buildPhase: resources
      - path: Fixtures/arabic-25.stl
        buildPhase: resources
      - path: Fixtures/embedded-subs.mkv
        buildPhase: resources
    dependencies:
      - target: Spotline
      - package: SpotlineKit
        product: SpotlineAccessibility
      - package: SpotlineKit
        product: EditorCommands
      - package: SpotlineKit
        product: AgentBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.saeedkhader.spotline.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Spotline
schemes:
  Spotline:
    build:
      targets:
        Spotline: all
        SpotlineUITests: [test]
    test:
      targets: [SpotlineUITests]
