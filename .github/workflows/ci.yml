name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Package tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - name: Install libmpv
        run: brew install mpv
      - name: Test SpotlineKit
        run: swift test --package-path Packages/SpotlineKit

  # macOS runs one UI test at a time, so the suite is split across runners instead.
  # Shards 1 and 2 name their test classes; shard 3 runs every class they don't name,
  # so a new test class runs there until it is given a shard.
  ui-tests:
    name: UI tests (shard ${{ matrix.shard }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SHARD_1: AIToolsUITests EpisodeBriefUITests
      SHARD_2: EditingUITests MainWindowUITests ProjectUITests AgentBridgeUITests
    steps:
      - uses: actions/checkout@v4
      - name: Pick this shard's tests
        run: |
          # A misspelled class would select no tests and still pass.
          for class in $SHARD_1 $SHARD_2; do
            grep -qE "class $class: XCTestCase" AppUITests/*.swift \
              || { echo "::error::No UI test class named $class"; exit 1; }
          done
          case "${{ matrix.shard }}" in
            1) flag=-only-testing; classes="$SHARD_1" ;;
            2) flag=-only-testing; classes="$SHARD_2" ;;
            3) flag=-skip-testing; classes="$SHARD_1 $SHARD_2" ;;
          esac
          selection=""
          for class in $classes; do
            selection="$selection $flag:SpotlineUITests/$class"
          done
          echo "TEST_SELECTION=$selection" >> "$GITHUB_ENV"
      - name: Install XcodeGen and libmpv
        run: brew install xcodegen mpv
      - name: Generate project
        run: xcodegen generate
      - name: Build and run UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Spotline.xcodeproj \
            -scheme Spotline \
            -destination 'platform=macOS' \
            -resultBundlePath build/UITests.xcresult \
            $TEST_SELECTION
      - name: Show app logs
        if: failure()
        run: |
          log show --last 15m --style compact \
            --predicate 'process == "Spotline" AND NOT subsystem == "com.apple.dt.xctest"' \
            | tail -n 300
          ls ~/Library/Logs/DiagnosticReports | grep -i spotline || true
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UITests-shard-${{ matrix.shard }}.xcresult
          path: build/UITests.xcresult

  # The check the main ruleset requires: green only when every shard is.
  app:
    name: App build and UI tests
    needs: ui-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every shard passed
        run: |
          echo "UI test shards: ${{ needs.ui-tests.result }}"
          test "${{ needs.ui-tests.result }}" = "success"
